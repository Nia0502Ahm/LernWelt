<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LernWelt – Klasse 5</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    text-align: center;
}

header {
    background: #2563eb;
    color: white;
    padding: 30px 20px;
}

.container {
    max-width: 800px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 18px;
}

.language {
    margin: 20px;
}

button {
    padding: 12px 20px;
    margin: 6px;
    border: none;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.subject {
    display: block;
    width: 90%;
    max-width: 650px;
    margin: 20px auto;
    padding: 22px;
    font-size: 21px;
}

.back {
    background: #64748b;
    margin-top: 25px;
}

h2 {
    font-size: 28px;
}

#languageText {
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>📚 LernWelt</h1>
    <p id="subtitle">Klasse 5</p>
</header>

<div class="container">

    <!-- SPRACHE -->

    <div class="language">

        <p id="languageText">🌐 Sprache:</p>

        <button onclick="changeLanguage('de')">
            🇩🇪 Deutsch
        </button>

        <button onclick="changeLanguage('en')">
            🇬🇧 English
        </button>

        <button onclick="changeLanguage('ps')">
            🇦🇫 پښتو
        </button>

    </div>


    <!-- ÜBERSCHRIFT -->

    <h2 id="title">🧮 Mathematik</h2>


    <!-- MATHEMATIK -->

    <button class="subject"
        onclick="location.href='mathe5.html'">

        🧮 <span id="math">Mathematik</span>

    </button>


    <!-- ZURÜCK -->

    <br>

    <button class="back"
        onclick="location.href='home.html'">

        ← <span id="back">Zurück</span>

    </button>

</div>


<script>

const translations = {

    de: {

        subtitle: "Klasse 5",

        language: "🌐 Sprache:",

        title: "🧮 Mathematik",

        math: "Mathematik",

        back: "Zurück"

    },


    en: {

        subtitle: "Grade 5",

        language: "🌐 Language:",

        title: "🧮 Mathematics",

        math: "Mathematics",

        back: "Back"

    },


    ps: {

        subtitle: "پنځم ټولګی",

        language: "🌐 ژبه:",

        title: "🧮 ریاضي",

        math: "ریاضي",

        back: "بېرته"

    }

};


function changeLanguage(language) {

    localStorage.setItem("language", language);

    const t = translations[language];


    document.getElementById("subtitle").textContent =
        t.subtitle;


    document.getElementById("languageText").textContent =
        t.language;


    document.getElementById("title").textContent =
        t.title;


    document.getElementById("math").textContent =
        t.math;


    document.getElementById("back").textContent =
        t.back;

}


const savedLanguage =
    localStorage.getItem("language") || "de";


changeLanguage(savedLanguage);

</script>

</body>
</html>
