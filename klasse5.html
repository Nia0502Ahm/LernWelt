```html
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LernWelt – Klasse 5</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    text-align: center;
}

header {
    background: #2563eb;
    color: white;
    padding: 30px 20px;
}

.container {
    max-width: 800px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 18px;
}

.language {
    margin: 20px;
}

button {
    padding: 12px 20px;
    margin: 6px;
    border: none;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.subject {
    display: block;
    width: 90%;
    max-width: 650px;
    margin: 14px auto;
    padding: 18px;
    font-size: 19px;
}

.back {
    background: #64748b;
    margin-top: 25px;
}

h2 {
    font-size: 28px;
}

#languageText {
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>📚 LernWelt</h1>
    <p id="subtitle">Klasse 5</p>
</header>

<div class="container">

    <!-- SPRACHE -->

    <div class="language">

        <p id="languageText">🌐 Sprache:</p>

        <button onclick="changeLanguage('de')">
            🇩🇪 Deutsch
        </button>

        <button onclick="changeLanguage('en')">
            🇬🇧 English
        </button>

        <button onclick="changeLanguage('ps')">
            🇦🇫 پښتو
        </button>

    </div>

    <!-- ÜBERSCHRIFT -->

    <h2 id="title">📚 Fächer auswählen</h2>

    <!-- MATHE -->

    <button class="subject"
        onclick="location.href='mathe5.html'">
        🧮 <span id="subject1">Mathematik</span>
    </button>

    <!-- DEUTSCH -->

    <button class="subject"
        onclick="location.href='deutsch5.html'">
        📖 <span id="subject2">Deutsch</span>
    </button>

    <!-- ENGLISCH -->

    <button class="subject"
        onclick="location.href='englisch5.html'">
        🇬🇧 <span id="subject3">Englisch</span>
    </button>

    <!-- ERDKUNDE -->

    <button class="subject"
        onclick="location.href='erdkunde5.html'">
        🌍 <span id="subject4">Erdkunde</span>
    </button>

    <!-- NATURWISSENSCHAFTEN -->

    <button class="subject"
        onclick="location.href='naturwissenschaften5.html'">
        🔬 <span id="subject5">Naturwissenschaften</span>
    </button>

    <!-- KLASSE -->

    <br>

    <button class="back"
        onclick="location.href='home.html'">
        ← <span id="back">Zurück</span>
    </button>

</div>


<script>

const translations = {

    de: {
        subtitle: "Klasse 5",
        language: "🌐 Sprache:",
        title: "📚 Fächer auswählen",

        subject1: "Mathematik",
        subject2: "Deutsch",
        subject3: "Englisch",
        subject4: "Erdkunde",
        subject5: "Naturwissenschaften",

        back: "Zurück"
    },

    en: {
        subtitle: "Grade 5",
        language: "🌐 Language:",
        title: "📚 Choose a subject",

        subject1: "Mathematics",
        subject2: "German",
        subject3: "English",
        subject4: "Geography",
        subject5: "Natural Sciences",

        back: "Back"
    },

    ps: {
        subtitle: "پنځم ټولګی",
        language: "🌐 ژبه:",

        title: "📚 مضمون وټاکئ",

        subject1: "ریاضي",
        subject2: "الماني ژبه",
        subject3: "انګلیسي ژبه",
        subject4: "جغرافیه",
        subject5: "طبیعي علوم",

        back: "بېرته"
    }

};


function changeLanguage(language) {

    localStorage.setItem("language", language);

    const t = translations[language];

    document.getElementById("subtitle").textContent =
        t.subtitle;

    document.getElementById("languageText").textContent =
        t.language;

    document.getElementById("title").textContent =
        t.title;

    document.getElementById("subject1").textContent =
        t.subject1;

    document.getElementById("subject2").textContent =
        t.subject2;

    document.getElementById("subject3").textContent =
        t.subject3;

    document.getElementById("subject4").textContent =
        t.subject4;

    document.getElementById("subject5").textContent =
        t.subject5;

    document.getElementById("back").textContent =
        t.back;
}


const savedLanguage =
    localStorage.getItem("language") || "de";

changeLanguage(savedLanguage);

</script>

</body>
</html>
```
