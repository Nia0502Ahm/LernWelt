<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LernWelt – Mathematik Klasse 5</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    text-align: center;
}

header {
    background: #2563eb;
    color: white;
    padding: 30px 20px;
}

.container {
    max-width: 800px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 18px;
}

.language {
    margin: 20px;
}

button {
    padding: 12px 20px;
    margin: 6px;
    border: none;
    border-radius: 9px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.topic {
    display: block;
    width: 90%;
    max-width: 650px;
    margin: 14px auto;
    padding: 18px;
    font-size: 18px;
}

.back {
    background: #64748b;
    margin-top: 20px;
}

h2 {
    font-size: 28px;
}

#languageText {
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>📚 LernWelt</h1>
    <p id="subtitle">Mathematik – Klasse 5</p>
</header>

<div class="container">

    <div class="language">

        <p id="languageText">🌐 Sprache:</p>

        <button onclick="changeLanguage('de')">
            🇩🇪 Deutsch
        </button>

        <button onclick="changeLanguage('en')">
            🇬🇧 English
        </button>

        <button onclick="changeLanguage('ps')">
            🇦🇫 پښتو
        </button>

    </div>

    <h2 id="title">🧮 Mathe-Themen</h2>

    <button class="topic"
        onclick="location.href='natuerliche-zahlen5.html'">
        🔢 <span id="topic1">Natürliche Zahlen</span>
    </button>

    <button class="topic"
        onclick="location.href='addieren-subtrahieren5.html'">
        ➕ <span id="topic2">Addieren und Subtrahieren</span>
    </button>

    <button class="topic"
        onclick="location.href='multiplizieren-dividieren5.html'">
        ✖️ <span id="topic3">Multiplizieren und Dividieren</span>
    </button>

    <button class="topic"
        onclick="location.href='zahlenstrahl-stellenwert5.html'">
        🔢 <span id="topic4">Zahlenstrahl und Stellenwert</span>
    </button>

    <button class="topic"
        onclick="location.href='groessen-einheiten5.html'">
        📏 <span id="topic5">Größen und Einheiten</span>
    </button>

    <button class="topic"
        onclick="location.href='geometrische-grundformen5.html'">
        📐 <span id="topic6">Geometrische Grundformen</span>
    </button>

    <button class="topic"
        onclick="location.href='daten-diagramme5.html'">
        📊 <span id="topic7">Daten und Diagramme</span>
    </button>

    <button class="topic"
        onclick="location.href='rechenregeln5.html'">
        🧮 <span id="topic8">Rechenregeln</span>
    </button>

    <br>

    <button class="back"
        onclick="location.href='klasse5.html'">
        ← <span id="back">Zurück</span>
    </button>

</div>

<script>

const translations = {

    de: {
        subtitle: "Mathematik – Klasse 5",
        language: "🌐 Sprache:",
        title: "🧮 Mathe-Themen",

        topic1: "Natürliche Zahlen",
        topic2: "Addieren und Subtrahieren",
        topic3: "Multiplizieren und Dividieren",
        topic4: "Zahlenstrahl und Stellenwert",
        topic5: "Größen und Einheiten",
        topic6: "Geometrische Grundformen",
        topic7: "Daten und Diagramme",
        topic8: "Rechenregeln",

        back: "Zurück"
    },

    en: {
        subtitle: "Mathematics – Grade 5",
        language: "🌐 Language:",
        title: "🧮 Math Topics",

        topic1: "Natural Numbers",
        topic2: "Addition and Subtraction",
        topic3: "Multiplication and Division",
        topic4: "Number Line and Place Value",
        topic5: "Measurements and Units",
        topic6: "Basic Geometric Shapes",
        topic7: "Data and Charts",
        topic8: "Calculation Rules",

        back: "Back"
    },

    ps: {
        subtitle: "ریاضي – پنځم ټولګی",
        language: "🌐 ژبه:",
        title: "🧮 د ریاضي موضوعات",

        topic1: "طبیعي شمېرې",
        topic2: "جمع او تفریق",
        topic3: "ضرب او تقسیم",
        topic4: "د عددونو کرښه او د عدد ځای",
        topic5: "اندازې او واحدونه",
        topic6: "بنسټیزې هندسي بڼې",
        topic7: "معلومات او ډیاګرامونه",
        topic8: "د محاسبې قواعد",

        back: "بېرته"
    }

};

function changeLanguage(language) {

    localStorage.setItem("language", language);

    const t = translations[language];

    document.getElementById("subtitle").textContent =
        t.subtitle;

    document.getElementById("languageText").textContent =
        t.language;

    document.getElementById("title").textContent =
        t.title;

    document.getElementById("topic1").textContent =
        t.topic1;

    document.getElementById("topic2").textContent =
        t.topic2;

    document.getElementById("topic3").textContent =
        t.topic3;

    document.getElementById("topic4").textContent =
        t.topic4;

    document.getElementById("topic5").textContent =
        t.topic5;

    document.getElementById("topic6").textContent =
        t.topic6;

    document.getElementById("topic7").textContent =
        t.topic7;

    document.getElementById("topic8").textContent =
        t.topic8;

    document.getElementById("back").textContent =
        t.back;
}

const savedLanguage =
    localStorage.getItem("language");

if (savedLanguage && translations[savedLanguage]) {
    changeLanguage(savedLanguage);
}

</script>

</body>
</html>
