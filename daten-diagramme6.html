<script>

let score = 0;
let answered = 0;


/* ================================
   ANTWORTEN ZUFÄLLIG MISCHEN
================================ */

function shuffleAnswers() {

    document.querySelectorAll(".question").forEach(function(question) {

        const buttons = Array.from(
            question.querySelectorAll(".answer")
        );

        for (let i = buttons.length - 1; i > 0; i--) {

            const random = Math.floor(Math.random() * (i + 1));

            [buttons[i], buttons[random]] =
            [buttons[random], buttons[i]];
        }

        buttons.forEach(function(button) {
            question.appendChild(button);
        });

    });
}


/* ================================
   ANTWORT PRÜFEN
================================ */

function checkAnswer(button, correct) {

    const question = button.parentElement;

    if (question.dataset.done === "true") {
        return;
    }

    question.dataset.done = "true";

    const buttons =
        question.querySelectorAll(".answer");

    buttons.forEach(function(btn) {
        btn.disabled = true;
    });


    if (correct) {

        button.classList.add("correct");

        score++;

    } else {

        button.classList.add("wrong");

        buttons.forEach(function(btn) {

            const code =
                btn.getAttribute("onclick");

            if (code && code.includes("true")) {

                btn.classList.add("correct");

            }

        });

    }

    answered++;

    updateScore();
}


/* ================================
   PUNKTE
================================ */

function updateScore() {

    const language =
        localStorage.getItem("language") || "de";


    if (language === "de") {

        document.getElementById("score").textContent =
            "🏆 Punkte: " + score + " / 30";

    }

    else if (language === "en") {

        document.getElementById("score").textContent =
            "🏆 Points: " + score + " / 30";

    }

    else {

        document.getElementById("score").textContent =
            "🏆 نمرې: " + score + " / ۳۰";

    }
}


/* ================================
   AUSWERTUNG
================================ */

function finishQuiz() {

    const language =
        localStorage.getItem("language") || "de";


    if (answered < 30) {

        if (language === "de") {

            document.getElementById("result").textContent =
                "⚠️ Bitte beantworte alle 30 Aufgaben.";

        }

        if (language === "en") {

            document.getElementById("result").textContent =
                "⚠️ Please answer all 30 questions.";

        }

        if (language === "ps") {

            document.getElementById("result").textContent =
                "⚠️ مهرباني وکړئ ټولې ۳۰ پوښتنې ځواب کړئ.";

        }

        return;
    }


    let result = "";


    if (language === "de") {

        if (score === 30) {

            result =
                "🎉 Perfekt! 30 von 30 Punkten!";

        }

        else if (score >= 25) {

            result =
                "👏 Sehr gut! " +
                score +
                " von 30 Punkten!";

        }

        else if (score >= 18) {

            result =
                "👍 Gut gemacht! " +
                score +
                " von 30 Punkten!";

        }

        else {

            result =
                "💪 Übe noch etwas! " +
                score +
                " von 30 Punkten.";

        }

    }


    else if (language === "en") {

        if (score === 30) {

            result =
                "🎉 Perfect! 30 out of 30 points!";

        }

        else if (score >= 25) {

            result =
                "👏 Very good! " +
                score +
                " out of 30 points!";

        }

        else if (score >= 18) {

            result =
                "👍 Good job! " +
                score +
                " out of 30 points!";

        }

        else {

            result =
                "💪 Keep practicing! " +
                score +
                " out of 30 points.";

        }

    }


    else {

        if (score === 30) {

            result =
                "🎉 ډېر ښه! ۳۰ له ۳۰ نمرې!";

        }

        else if (score >= 25) {

            result =
                "👏 ډېر ښه! " +
                score +
                " له ۳۰ نمرې!";

        }

        else if (score >= 18) {

            result =
                "👍 ښه کار! " +
                score +
                " له ۳۰ نمرې!";

        }

        else {

            result =
                "💪 لا ډېر تمرین وکړه! " +
                score +
                " له ۳۰ څخه.";

        }

    }


    document.getElementById("result").textContent =
        result;
}


/* ================================
   NEU STARTEN
================================ */

function restartQuiz() {

    score = 0;

    answered = 0;


    document.querySelectorAll(".question")
        .forEach(function(question) {

        question.dataset.done = "false";


        question.querySelectorAll(".answer")
            .forEach(function(button) {

            button.disabled = false;

            button.classList.remove("correct");

            button.classList.remove("wrong");

        });

    });


    document.getElementById("result").textContent = "";

    updateScore();

    /* Antworten wieder neu mischen */
    shuffleAnswers();
}

/* ================================
   SPRACHE ÄNDERN
================================ */

function changeLanguage(language) {

    localStorage.setItem("language", language);

    const t =
        translations[language];


    document.getElementById("subtitle").textContent =
        t.subtitle;

    document.getElementById("languageText").textContent =
        t.language;

    document.getElementById("title").textContent =
        t.title;

    document.getElementById("explanationTitle").textContent =
        t.explanationTitle;

    document.getElementById("explanationText").textContent =
        t.explanationText;

    document.getElementById("exampleTitle").textContent =
        t.exampleTitle;

    document.getElementById("exerciseTitle").textContent =
        t.exerciseTitle;

    document.getElementById("finishButton").textContent =
        t.finish;

    document.getElementById("restartButton").textContent =
        t.restart;

    document.getElementById("backButton").textContent =
        t.back;


    updateScore();
}


/* ================================
   START
================================ */

const savedLanguage =
    localStorage.getItem("language") || "de";

changeLanguage(savedLanguage);


/* Antworten beim Öffnen mischen */
shuffleAnswers();

</script>
