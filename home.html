```html
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LernWelt</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    text-align: center;
}

header {
    background: #2563eb;
    color: white;
    padding: 35px 20px;
}

.container {
    max-width: 700px;
    margin: 40px auto;
    padding: 30px;
    background: white;
    border-radius: 18px;
}

h1 {
    font-size: 36px;
}

.language-title {
    font-size: 22px;
    margin-top: 30px;
}

.language-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin: 25px 0;
}

button {
    padding: 15px 25px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin: 8px;
}

button:hover {
    background: #1d4ed8;
}

.language-button {
    font-size: 18px;
}

#classBox {
    display: none;
    margin-top: 30px;
}

.class-button {
    display: block;
    width: 280px;
    margin: 12px auto;
}

#message {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>📚 LernWelt</h1>
    <p id="subtitle">Lernen einfach gemacht</p>
</header>

<div class="container">

    <!-- SPRACHE -->

    <h2 id="chooseLanguage">🌐 Sprache auswählen</h2>

    <div class="language-buttons">

        <button class="language-button"
                onclick="changeLanguage('de')">
            🇩🇪 Deutsch
        </button>

        <button class="language-button"
                onclick="changeLanguage('en')">
            🇬🇧 English
        </button>

        <button class="language-button"
                onclick="changeLanguage('ps')">
            🇦🇫 پښتو
        </button>

    </div>

    <p id="message">
        Wähle deine Sprache aus.
    </p>

    <br>

    <!-- START -->

    <button onclick="showClasses()" id="startButton">
        🚀 Start
    </button>

    <!-- KLASSENAUSWAHL -->

    <div id="classBox">

        <h2 id="classTitle">
            🎓 Klasse auswählen
        </h2>

        <button class="class-button"
                onclick="selectClass(5)">
            📚 Klasse 5
        </button>

        <button class="class-button"
                onclick="selectClass(6)">
            📚 Klasse 6
        </button>

        <button class="class-button"
                onclick="selectClass(7)">
            📚 Klasse 7
        </button>

        <button class="class-button"
                onclick="selectClass(8)">
            📚 Klasse 8
        </button>

        <button class="class-button"
                onclick="selectClass(9)">
            📚 Klasse 9
        </button>

        <button class="class-button"
                onclick="selectClass(10)">
            📚 Klasse 10
        </button>

    </div>

</div>


<script>

const translations = {

    de: {
        subtitle: "Lernen einfach gemacht",
        choose: "🌐 Sprache auswählen",
        message: "Wähle deine Sprache aus.",
        start: "🚀 Start",
        classTitle: "🎓 Klasse auswählen"
    },

    en: {
        subtitle: "Learning made easy",
        choose: "🌐 Choose your language",
        message: "Choose your language.",
        start: "🚀 Start",
        classTitle: "🎓 Choose your grade"
    },

    ps: {
        subtitle: "زده کړه په اسانه",
        choose: "🌐 خپله ژبه وټاکئ",
        message: "خپله ژبه وټاکئ.",
        start: "🚀 پیل",
        classTitle: "🎓 خپل ټولګی وټاکئ"
    }

};


let currentLanguage =
    localStorage.getItem("language") || "de";


function changeLanguage(language) {

    currentLanguage = language;

    localStorage.setItem("language", language);

    const t = translations[language];

    document.getElementById("subtitle").textContent =
        t.subtitle;

    document.getElementById("chooseLanguage").textContent =
        t.choose;

    document.getElementById("message").textContent =
        t.message;

    document.getElementById("startButton").textContent =
        t.start;

    document.getElementById("classTitle").textContent =
        t.classTitle;
}


function showClasses() {

    document.getElementById("classBox").style.display =
        "block";

    document.getElementById("startButton").style.display =
        "none";
}


function selectClass(number) {

    localStorage.setItem("selectedClass", number);

    if (number === 5) {

        window.location.href = "klasse5.html";

    } else {

        alert(
            "Klasse " + number +
            " wird noch erstellt."
        );

    }
}


changeLanguage(currentLanguage);

</script>

</body>
</html>
```
