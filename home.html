<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LernWelt</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    text-align: center;
}

header {
    background: #2563eb;
    color: white;
    padding: 35px 20px;
}

.container {
    max-width: 700px;
    margin: 40px auto;
    padding: 30px;
    background: white;
    border-radius: 18px;
}

h1 {
    font-size: 36px;
}

.language-title {
    font-size: 22px;
    margin-top: 30px;
}

.language-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin: 25px 0;
}

button {
    padding: 15px 25px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.language-button {
    font-size: 18px;
}

#message {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>📚 LernWelt</h1>
    <p id="subtitle">Lernen einfach gemacht</p>
</header>

<div class="container">

    <h2 id="chooseLanguage">🌐 Sprache auswählen</h2>

    <div class="language-buttons">

        <button class="language-button"
                onclick="changeLanguage('de')">
            🇩🇪 Deutsch
        </button>

        <button class="language-button"
                onclick="changeLanguage('en')">
            🇬🇧 English
        </button>

        <button class="language-button"
                onclick="changeLanguage('ps')">
            🇦🇫 پښتو
        </button>

    </div>

    <p id="message">
        Wähle deine Sprache aus.
    </p>

    <br>

    <button onclick="goToSubjects()" id="startButton">
        🚀 Start
    </button>

</div>

<script>

const translations = {

    de: {
        subtitle: "Lernen einfach gemacht",
        choose: "🌐 Sprache auswählen",
        message: "Wähle deine Sprache aus.",
        start: "🚀 Start"
    },

    en: {
        subtitle: "Learning made easy",
        choose: "🌐 Choose your language",
        message: "Choose your language.",
        start: "🚀 Start"
    },

    ps: {
        subtitle: "زده کړه په اسانه",
        choose: "🌐 خپله ژبه وټاکئ",
        message: "خپله ژبه وټاکئ.",
        start: "🚀 پیل"
    }

};

function changeLanguage(language) {

    localStorage.setItem("language", language);

    document.getElementById("subtitle").textContent =
        translations[language].subtitle;

    document.getElementById("chooseLanguage").textContent =
        translations[language].choose;

    document.getElementById("message").textContent =
        translations[language].message;

    document.getElementById("startButton").textContent =
        translations[language].start;
}

function goToSubjects() {

    window.location.href = "klasse5.html";
}

const savedLanguage =
    localStorage.getItem("language");

if (savedLanguage && translations[savedLanguage]) {
    changeLanguage(savedLanguage);
}

</script>

</body>
</html>
