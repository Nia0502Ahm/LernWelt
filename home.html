```html
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LernWelt</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    text-align: center;
}

header {
    background: #2563eb;
    color: white;
    padding: 35px 20px;
}

header h1 {
    margin: 0;
    font-size: 36px;
}

.container {
    max-width: 750px;
    margin: 35px auto;
    padding: 30px;
    background: white;
    border-radius: 18px;
}

.language-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0 30px;
}

button {
    padding: 14px 22px;
    margin: 7px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.language-button {
    font-size: 16px;
}

.class-button {
    display: block;
    width: 90%;
    max-width: 500px;
    margin: 12px auto;
    padding: 17px;
    font-size: 19px;
}

#classTitle {
    margin-top: 25px;
    font-size: 28px;
}

#message {
    font-weight: bold;
    margin: 15px;
}

.back {
    background: #64748b;
    margin-top: 25px;
}
</style>
</head>

<body>

<header>
    <h1>📚 LernWelt</h1>
    <p id="subtitle">Lernen von Klasse 5 bis zum Abitur</p>
</header>

<div class="container">

    <!-- SPRACHE -->

    <h2 id="languageTitle">🌐 Sprache auswählen</h2>

    <div class="language-buttons">

        <button class="language-button"
                onclick="changeLanguage('de')">
            🇩🇪 Deutsch
        </button>

        <button class="language-button"
                onclick="changeLanguage('en')">
            🇬🇧 English
        </button>

        <button class="language-button"
                onclick="changeLanguage('ps')">
            🇦🇫 پښتو
        </button>

    </div>

    <p id="message">
        Wähle zuerst deine Klasse aus.
    </p>

    <!-- KLASSEN -->

    <h2 id="classTitle">🎓 Klasse auswählen</h2>

    <button class="class-button"
            onclick="selectClass(5)">
        📚 Klasse 5
    </button>

    <button class="class-button"
            onclick="selectClass(6)">
        📚 Klasse 6
    </button>

    <button class="class-button"
            onclick="selectClass(7)">
        📚 Klasse 7
    </button>

    <button class="class-button"
            onclick="selectClass(8)">
        📚 Klasse 8
    </button>

    <button class="class-button"
            onclick="selectClass(9)">
        📚 Klasse 9
    </button>

    <button class="class-button"
            onclick="selectClass(10)">
        📚 Klasse 10
    </button>

    <button class="class-button"
            onclick="selectClass(11)">
        📚 Klasse 11
    </button>

    <button class="class-button"
            onclick="selectClass(12)">
        📚 Klasse 12
    </button>

    <button class="class-button"
            onclick="selectClass(13)">
        📚 Klasse 13
    </button>

    <button class="class-button"
            onclick="selectAbitur()">
        🎓 Abitur
    </button>

</div>


<script>

const translations = {

    de: {
        subtitle: "Lernen von Klasse 5 bis zum Abitur",
        languageTitle: "🌐 Sprache auswählen",
        message: "Wähle zuerst deine Klasse aus.",
        classTitle: "🎓 Klasse auswählen"
    },

    en: {
        subtitle: "Learning from grade 5 to high school",
        languageTitle: "🌐 Choose your language",
        message: "First choose your grade.",
        classTitle: "🎓 Choose your grade"
    },

    ps: {
        subtitle: "له پنځم ټولګي څخه تر ابیتور پورې زده کړه",
        languageTitle: "🌐 خپله ژبه وټاکئ",
        message: "لومړی خپل ټولګی وټاکئ.",
        classTitle: "🎓 خپل ټولګی وټاکئ"
    }

};


let currentLanguage =
    localStorage.getItem("language") || "de";


function changeLanguage(language) {

    currentLanguage = language;

    localStorage.setItem("language", language);

    const t = translations[language];

    document.getElementById("subtitle").textContent =
        t.subtitle;

    document.getElementById("languageTitle").textContent =
        t.languageTitle;

    document.getElementById("message").textContent =
        t.message;

    document.getElementById("classTitle").textContent =
        t.classTitle;
}


function selectClass(number) {

    localStorage.setItem("selectedClass", number);

    /*
       Klasse 5 hat bereits eine fertige Fächerseite.
       Die anderen Klassen können später ergänzt werden.
    */

    if (number === 5) {

        window.location.href = "klasse5.html";

    } else {

        alert(
            "Klasse " + number +
            " ist noch nicht erstellt."
        );

    }
}


function selectAbitur() {

    localStorage.setItem("selectedClass", "abitur");

    alert(
        "Die Abitur-Seite wird noch erstellt."
    );
}


changeLanguage(currentLanguage);

</script>

</body>
</html>
```
