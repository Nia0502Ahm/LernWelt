<!DOCTYPE html>

<head>

<style>
body {

.class-button {

<body>

<header>
    <h1>📚 LernWelt</h1>

<div class="container">

        </button>

                onclick="changeLanguage('en')">
            🇬🇧 English
        </button>

        <button class="language-button"
                onclick="changeLanguage('ps')">
            🇦🇫 پښتو
        </button>

    </div>

    <p id="message">
        Wähle zuerst deine Klasse aus.
    </p>


    <!-- KLASSENAUSWAHL -->

    <h2 id="classTitle">
        🎓 Klasse auswählen
    </h2>


    <button class="class-button"
            onclick="selectClass(5)">
        📚 <span id="class5">Klasse 5</span>
    </button>

    <button class="class-button"
            onclick="selectClass(6)">
        📚 <span id="class6">Klasse 6</span>

    <button class="class-button"

        📚 <span id="class10">Klasse 10</span>
    </button>

    <button class="class-button"

    </button>

    <button class="class-button"
            onclick="selectClass(12)">
        📚 <span id="class12">Klasse 12</span>
    </button>

    <button class="class-button"
            onclick="selectClass(13)">
        📚 <span id="class13">Klasse 13</span>

            onclick="selectAbitur()">
        🎓 <span id="abitur">Abitur</span>
    </button>

</div>


<script>

const translations = {

    de: {

        subtitle:
        "Lernen von Klasse 5 bis zum Abitur",

        languageTitle:
        "🌐 Sprache auswählen",

        message:
        "Wähle zuerst deine Klasse aus.",

        classTitle:
        "🎓 Klasse auswählen",

        class5: "Klasse 5",
        class6: "Klasse 6",
        class7: "Klasse 7",
        class8: "Klasse 8",
        class9: "Klasse 9",
        class10: "Klasse 10",
        class11: "Klasse 11",
        class12: "Klasse 12",
        class13: "Klasse 13",

        abitur:
        "Abitur"
    },


    en: {

        subtitle:
        "Learning from grade 5 to high school",

        languageTitle:
        "🌐 Choose your language",

        message:
        "First choose your grade.",

        classTitle:
        "🎓 Choose your grade",

        class5: "Grade 5",
        class6: "Grade 6",
        class7: "Grade 7",
        class8: "Grade 8",
        class9: "Grade 9",
        class10: "Grade 10",
        class11: "Grade 11",
        class12: "Grade 12",
        class13: "Grade 13",

        abitur:
        "High School Diploma"
    },


    ps: {

        subtitle:
        "له پنځم ټولګي څخه تر ابیتور پورې زده کړه",

        languageTitle:
        "🌐 خپله ژبه وټاکئ",

        message:
        "لومړی خپل ټولګی وټاکئ.",

        classTitle:
        "🎓 خپل ټولګی وټاکئ",

        class5: "پنځم ټولګی",
        class6: "شپږم ټولګی",
        class7: "اووم ټولګی",
        class8: "اتم ټولګی",
        class9: "نهم ټولګی",
        class10: "لسم ټولګی",
        class11: "یوولسم ټولګی",
        class12: "دولسم ټولګی",
        class13: "دیارلسم ټولګی",

        abitur:
        "ابیتور"
    }

};


let currentLanguage =
    localStorage.getItem("language") || "de";


function changeLanguage(language) {

    currentLanguage = language;

    localStorage.setItem("language", language);

    const t = translations[language];


    document.getElementById("subtitle").textContent =
        t.subtitle;

    document.getElementById("languageTitle").textContent =
        t.languageTitle;

    document.getElementById("message").textContent =
        t.message;

    document.getElementById("classTitle").textContent =
        t.classTitle;


    document.getElementById("class5").textContent =
        t.class5;

    document.getElementById("class6").textContent =
        t.class6;

    document.getElementById("class7").textContent =
        t.class7;

    document.getElementById("class8").textContent =
        t.class8;

    document.getElementById("class9").textContent =
        t.class9;

    document.getElementById("class10").textContent =
        t.class10;

    document.getElementById("class11").textContent =
        t.class11;

    document.getElementById("class12").textContent =
        t.class12;

    document.getElementById("class13").textContent =
        t.class13;

    document.getElementById("abitur").textContent =
        t.abitur;
}


function selectClass(number) {

    localStorage.setItem(
        "selectedClass",
        number
    );


    if (number === 5) {

        window.location.href =
            "klasse5.html";

    } else {

        alert(
            "Diese Klasse wird noch erstellt."
        );

    }
}


function selectAbitur() {

    localStorage.setItem(
        "selectedClass",
        "abitur"
    );

    alert(
        "Die Abitur-Seite wird noch erstellt."
    );
}


changeLanguage(currentLanguage);

</script>
