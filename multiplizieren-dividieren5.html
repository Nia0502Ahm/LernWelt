<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LernWelt – Multiplizieren und Dividieren</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 30px 20px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
        }

        .explanation {
            background: #eff6ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: left;
        }

        input {
            width: 80%;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin: 15px;
            box-sizing: border-box;
        }

        button {
            padding: 13px 25px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        #solution {
            display: none;
            background: #f1f5f9;
            padding: 18px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: left;
        }

        #nextButton {
            display: none;
        }

        .back {
            background: #64748b;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 LernWelt</h1>
    <p>Mathe Klasse 5</p>
</header>

<div class="container">

    <h2>✖️ Multiplizieren und Dividieren</h2>

    <div class="explanation">
        <h3>📖 Kurze Erklärung</h3>

        <p>
            Beim <strong>Multiplizieren</strong> werden Zahlen miteinander malgenommen.
        </p>

        <p>
            Beispiel: 6 · 4 = 24
        </p>

        <p>
            Beim <strong>Dividieren</strong> wird eine Zahl geteilt.
        </p>

        <p>
            Beispiel: 24 : 4 = 6
        </p>

        <p>
            Multiplikation und Division sind Umkehraufgaben.
        </p>
    </div>

    <p id="progress"></p>

    <h3 id="question"></h3>

    <input id="answer" type="text" placeholder="Deine Antwort">

    <br>

    <button onclick="checkAnswer()">
        Antwort prüfen
    </button>

    <div id="result"></div>

    <div id="solution">
        <h3>💡 Lösung</h3>
        <p id="solutionText"></p>
    </div>

    <button id="nextButton" onclick="nextQuestion()">
        ➡️ Nächste Aufgabe
    </button>

    <br>

    <button class="back"
        onclick="window.location.href='mathe5.html'">
        ← Zurück zu den Themen
    </button>

</div>

<script>

const questions = [

    {
        q: "6 · 4 = ?",
        answer: "24",
        solution: "6 · 4 = 24."
    },

    {
        q: "7 · 5 = ?",
        answer: "35",
        solution: "7 · 5 = 35."
    },

    {
        q: "8 · 6 = ?",
        answer: "48",
        solution: "8 · 6 = 48."
    },

    {
        q: "9 · 7 = ?",
        answer: "63",
        solution: "9 · 7 = 63."
    },

    {
        q: "12 · 3 = ?",
        answer: "36",
        solution: "12 · 3 = 36."
    },

    {
        q: "15 · 4 = ?",
        answer: "60",
        solution: "15 · 4 = 60."
    },

    {
        q: "20 · 5 = ?",
        answer: "100",
        solution: "20 · 5 = 100."
    },

    {
        q: "25 · 4 = ?",
        answer: "100",
        solution: "25 · 4 = 100."
    },

    {
        q: "30 · 3 = ?",
        answer: "90",
        solution: "30 · 3 = 90."
    },

    {
        q: "11 · 6 = ?",
        answer: "66",
        solution: "11 · 6 = 66."
    },

    {
        q: "24 : 4 = ?",
        answer: "6",
        solution: "24 : 4 = 6."
    },

    {
        q: "35 : 5 = ?",
        answer: "7",
        solution: "35 : 5 = 7."
    },

    {
        q: "48 : 6 = ?",
        answer: "8",
        solution: "48 : 6 = 8."
    },

    {
        q: "63 : 7 = ?",
        answer: "9",
        solution: "63 : 7 = 9."
    },

    {
        q: "36 : 3 = ?",
        answer: "12",
        solution: "36 : 3 = 12."
    },

    {
        q: "60 : 4 = ?",
        answer: "15",
        solution: "60 : 4 = 15."
    },

    {
        q: "100 : 5 = ?",
        answer: "20",
        solution: "100 : 5 = 20."
    },

    {
        q: "120 : 6 = ?",
        answer: "20",
        solution: "120 : 6 = 20."
    },

    {
        q: "150 : 5 = ?",
        answer: "30",
        solution: "150 : 5 = 30."
    },

    {
        q: "200 : 10 = ?",
        answer: "20",
        solution: "200 : 10 = 20."
    },

    {
        q: "14 · 5 = ?",
        answer: "70",
        solution: "14 · 5 = 70."
    },

    {
        q: "16 · 6 = ?",
        answer: "96",
        solution: "16 · 6 = 96."
    },

    {
        q: "18 · 5 = ?",
        answer: "90",
        solution: "18 · 5 = 90."
    },

    {
        q: "21 · 4 = ?",
        answer: "84",
        solution: "21 · 4 = 84."
    },

    {
        q: "72 : 8 = ?",
        answer: "9",
        solution: "72 : 8 = 9."
    },

    {
        q: "81 : 9 = ?",
        answer: "9",
        solution: "81 : 9 = 9."
    },

    {
        q: "96 : 8 = ?",
        answer: "12",
        solution: "96 : 8 = 12."
    },

    {
        q: "144 : 12 = ?",
        answer: "12",
        solution: "144 : 12 = 12."
    },

    {
        q: "25 · 8 = ?",
        answer: "200",
        solution: "25 · 8 = 200."
    },

    {
        q: "240 : 6 = ?",
        answer: "40",
        solution: "240 : 6 = 40."
    }

];

let current = 0;

function showQuestion() {

    document.getElementById("question").textContent =
        questions[current].q;

    document.getElementById("progress").textContent =
        "Aufgabe " + (current + 1) +
        " von " + questions.length;

    document.getElementById("answer").value = "";

    document.getElementById("answer").disabled = false;

    document.getElementById("result").textContent = "";

    document.getElementById("solution").style.display = "none";

    document.getElementById("nextButton").style.display = "none";
}

function checkAnswer() {

    const userAnswer =
        document.getElementById("answer").value
        .trim()
        .replace(/\s/g, "");

    const correctAnswer =
        questions[current].answer
        .replace(/\s/g, "");

    if (userAnswer === correctAnswer) {

        document.getElementById("result").textContent =
            "✅ Richtig! Sehr gut! 🎉";

    } else {

        document.getElementById("result").textContent =
            "❌ Leider falsch.";

        document.getElementById("solution").style.display =
            "block";

        document.getElementById("solutionText").textContent =
            questions[current].solution;
    }

    document.getElementById("answer").disabled = true;

    document.getElementById("nextButton").style.display =
        "inline-block";
}

function nextQuestion() {

    current++;

    if (current >= questions.length) {

        document.getElementById("question").textContent =
            "🎉 Du hast alle 30 Aufgaben geschafft!";

        document.getElementById("progress").textContent =
            "Fertig! 🏆";

        document.getElementById("answer").style.display =
            "none";

        document.getElementById("result").textContent =
            "Super gemacht! 🎓";

        document.getElementById("nextButton").style.display =
            "none";

        document.getElementById("solution").style.display =
            "none";

        return;
    }

    showQuestion();
}

showQuestion();

</script>

</body>
</html>
