<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LernWelt – Multiplizieren und Dividieren</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 30px 20px;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
        }

        .explanation {
            background: #eff6ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: left;
        }

        .visual {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 24px;
        }

        .groups {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .group {
            padding: 12px;
            background: #dbeafe;
            border-radius: 10px;
            min-width: 70px;
        }

        input {
            width: 80%;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin: 15px;
            box-sizing: border-box;
        }

        button {
            padding: 13px 25px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        #solution {
            display: none;
            background: #f1f5f9;
            padding: 18px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: left;
        }

        #nextButton {
            display: none;
        }

        .back {
            background: #64748b;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 LernWelt</h1>
    <p>Mathe Klasse 5</p>
</header>

<div class="container">

    <h2>✖️ Multiplizieren und Dividieren</h2>

    <div class="explanation">
        <h3>📖 Kurze Erklärung</h3>

        <p>
            Beim <strong>Multiplizieren</strong> werden gleiche Mengen
            zusammengezählt.
        </p>

        <p>
            Beispiel: 3 · 4 = 12
        </p>

        <p>
            Beim <strong>Dividieren</strong> wird eine Menge gleichmäßig
            aufgeteilt.
        </p>

        <p>
            Beispiel: 12 : 3 = 4
        </p>
    </div>

    <p id="progress"></p>

    <h3 id="question"></h3>

    <div id="visual" class="visual"></div>

    <input id="answer" type="text" placeholder="Deine Antwort">

    <br>

    <button onclick="checkAnswer()">
        Antwort prüfen
    </button>

    <div id="result"></div>

    <div id="solution">
        <h3>💡 Lösung</h3>
        <p id="solutionText"></p>
    </div>

    <button id="nextButton" onclick="nextQuestion()">
        ➡️ Nächste Aufgabe
    </button>

    <br>

    <button class="back"
        onclick="window.location.href='mathe5.html'">
        ← Zurück zu den Themen
    </button>

</div>

<script>

const questions = [

    {
        q: "2 · 3 = ?",
        visual: `
            <div class="groups">
                <div class="group">🔵 🔵 🔵</div>
                <div class="group">🔵 🔵 🔵</div>
            </div>
        `,
        answer: "6",
        solution: "2 · 3 = 6."
    },

    {
        q: "3 · 4 = ?",
        visual: `
            <div class="groups">
                <div class="group">🟦 🟦 🟦 🟦</div>
                <div class="group">🟦 🟦 🟦 🟦</div>
                <div class="group">🟦 🟦 🟦 🟦</div>
            </div>
        `,
        answer: "12",
        solution: "3 · 4 = 12."
    },

    {
        q: "4 · 5 = ?",
        visual: "🟢🟢🟢🟢🟢 &nbsp; × &nbsp; 4 Gruppen",
        answer: "20",
        solution: "4 · 5 = 20."
    },

    {
        q: "5 · 2 = ?",
        visual: "🟡🟡 × 5 Gruppen",
        answer: "10",
        solution: "5 · 2 = 10."
    },

    {
        q: "6 · 3 = ?",
        visual: "🔵🔵🔵 × 6 Gruppen",
        answer: "18",
        solution: "6 · 3 = 18."
    },

    {
        q: "7 · 2 = ?",
        visual: "🟩🟩 × 7 Gruppen",
        answer: "14",
        solution: "7 · 2 = 14."
    },

    {
        q: "8 · 3 = ?",
        visual: "🟦🟦🟦 × 8 Gruppen",
        answer: "24",
        solution: "8 · 3 = 24."
    },

    {
        q: "9 · 2 = ?",
        visual: "🔴🔴 × 9 Gruppen",
        answer: "18",
        solution: "9 · 2 = 18."
    },

    {
        q: "10 · 4 = ?",
        visual: "🟨🟨🟨🟨 × 10 Gruppen",
        answer: "40",
        solution: "10 · 4 = 40."
    },

    {
        q: "5 · 5 = ?",
        visual: "🟣🟣🟣🟣🟣 × 5 Gruppen",
        answer: "25",
        solution: "5 · 5 = 25."
    },

    {
        q: "12 : 3 = ?",
        visual: `
            <div class="groups">
                🍎🍎🍎🍎
                🍎🍎🍎🍎
                🍎🍎🍎🍎
            </div>
        `,
        answer: "4",
        solution: "12 : 3 = 4."
    },

    {
        q: "20 : 4 = ?",
        visual: "🟢🟢🟢🟢🟢🟢🟢🟢🟢🟢🟢🟢🟢🟢🟢🟢🟢🟢🟢🟢",
        answer: "5",
        solution: "20 : 4 = 5."
    },

    {
        q: "18 : 3 = ?",
        visual: "🔵🔵🔵🔵🔵🔵🔵🔵🔵🔵🔵🔵🔵🔵🔵🔵🔵🔵",
        answer: "6",
        solution: "18 : 3 = 6."
    },

    {
        q: "24 : 4 = ?",
        visual: "🟦🟦🟦🟦🟦🟦🟦🟦🟦🟦🟦🟦🟦🟦🟦🟦🟦🟦🟦🟦🟦🟦🟦🟦",
        answer: "6",
        solution: "24 : 4 = 6."
    },

    {
        q: "30 : 5 = ?",
        visual: "🟡🟡🟡🟡🟡 × 6 Gruppen",
        answer: "6",
        solution: "30 : 5 = 6."
    },

    {
        q: "6 · 6 = ?",
        visual: "🟩🟩🟩🟩🟩🟩 × 6 Gruppen",
        answer: "36",
        solution: "6 · 6 = 36."
    },

    {
        q: "7 · 5 = ?",
        visual: "🟠🟠🟠🟠🟠 × 7 Gruppen",
        answer: "35",
        solution: "7 · 5 = 35."
    },

    {
        q: "8 · 4 = ?",
        visual: "🟦🟦🟦🟦 × 8 Gruppen",
        answer: "32",
        solution: "8 · 4 = 32."
    },

    {
        q: "9 · 5 = ?",
        visual: "🟣🟣🟣🟣🟣 × 9 Gruppen",
        answer: "45",
        solution: "9 · 5 = 45."
    },

    {
        q: "10 · 6 = ?",
        visual: "🟨🟨🟨🟨🟨🟨 × 10 Gruppen",
        answer: "60",
        solution: "10 · 6 = 60."
    },

    {
        q: "36 : 6 = ?",
        visual: "36 Punkte werden auf 6 Gruppen verteilt.",
        answer: "6",
        solution: "36 : 6 = 6."
    },

    {
        q: "40 : 8 = ?",
        visual: "40 Punkte werden auf 8 Gruppen verteilt.",
        answer: "5",
        solution: "40 : 8 = 5."
    },

    {
        q: "45 : 5 = ?",
        visual: "45 Punkte werden auf 5 Gruppen verteilt.",
        answer: "9",
        solution: "45 : 5 = 9."
    },

    {
        q: "50 : 10 = ?",
        visual: "50 Punkte werden auf 10 Gruppen verteilt.",
        answer: "5",
        solution: "50 : 10 = 5."
    },

    {
        q: "12 · 2 = ?",
        visual: "🔵🔵 × 12 Gruppen",
        answer: "24",
        solution: "12 · 2 = 24."
    },

    {
        q: "15 · 3 = ?",
        visual: "🟢🟢🟢 × 15 Gruppen",
        answer: "45",
        solution: "15 · 3 = 45."
    },

    {
        q: "60 : 6 = ?",
        visual: "60 Punkte werden auf 6 Gruppen verteilt.",
        answer: "10",
        solution: "60 : 6 = 10."
    },

    {
        q: "72 : 8 = ?",
        visual: "72 Punkte werden auf 8 Gruppen verteilt.",
        answer: "9",
        solution: "72 : 8 = 9."
    },

    {
        q: "100 : 10 = ?",
        visual: "💯 100 Punkte → 10 gleiche Gruppen",
        answer: "10",
        solution: "100 : 10 = 10."
    },

    {
        q: "25 · 4 = ?",
        visual: "25 · 4 = ❓",
        answer: "100",
        solution: "25 · 4 = 100."
    }

];

let current = 0;

function showQuestion() {

    document.getElementById("question").textContent =
        questions[current].q;

    document.getElementById("visual").innerHTML =
        questions[current].visual;

    document.getElementById("progress").textContent =
        "Aufgabe " + (current + 1) +
        " von " + questions.length;

    document.getElementById("answer").value = "";

    document.getElementById("answer").disabled = false;

    document.getElementById("result").textContent = "";

    document.getElementById("solution").style.display = "none";

    document.getElementById("nextButton").style.display = "none";
}

function checkAnswer() {

    const userAnswer =
        document.getElementById("answer").value
        .trim()
        .replace(/\s/g, "");

    const correctAnswer =
        questions[current].answer
        .replace(/\s/g, "");

    if (userAnswer === correctAnswer) {

        document.getElementById("result").textContent =
            "✅ Richtig! Sehr gut! 🎉";

    } else {

        document.getElementById("result").textContent =
            "❌ Leider falsch.";

        document.getElementById("solution").style.display =
            "block";

        document.getElementById("solutionText").textContent =
            questions[current].solution;
    }

    document.getElementById("answer").disabled = true;

    document.getElementById("nextButton").style.display =
        "inline-block";
}

function nextQuestion() {

    current++;

    if (current >= questions.length) {

        document.getElementById("question").textContent =
            "🎉 Du hast alle 30 Aufgaben geschafft!";

        document.getElementById("progress").textContent =
            "Fertig! 🏆";

        document.getElementById("visual").style.display =
            "none";

        document.getElementById("answer").style.display =
            "none";

        document.getElementById("result").textContent =
            "Super gemacht! 🎓";

        document.getElementById("nextButton").style.display =
            "none";

        document.getElementById("solution").style.display =
            "none";

        return;
    }

    showQuestion();
}

showQuestion();

</script>

</body>
</html>
