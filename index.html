<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LernWelt</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseClient = supabase.createClient(
 "https://hridnnwxsgionkeuhaas.supabase.co",
        "sb_publishable_4DTDbPS-tS5P1u3OAcCe_Q_jNdZQ8P8"
        );
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 30px 20px;
        }

        h1 {
            margin: 0;
            font-size: 36px;
        }

        .container {
            padding: 40px 20px;
        }

        button {
            display: block;
            width: 250px;
            margin: 15px auto;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #authBox {
            background: white;
            max-width: 400px;
            margin: 20px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        input {
            display: block;
            width: 90%;
            margin: 12px auto;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        #message {
            margin: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 LernWelt</h1>
        <p>Lernen von Klasse 5 bis zum Abitur</p>
    </header>
<button onclick="showRegister()">Registrieren</button>
<button onclick="showLogin()">Anmelden</button>
<button>🎓 Klasse auswählen</button>
    <div id="authBox" style="display:none;">

        <h2 id="authTitle">Registrieren</h2>

        <input
            id="email"
            type="email"
            placeholder="E-Mail"
        >

        <input
            id="password"
            type="password"
            placeholder="Passwort"
        >

        <button id="registerButton" onclick="register()">
            Konto erstellen
        </button>

        <button id="loginButton" onclick="login()" style="display:none;">
            Anmelden
        </button>

        <div id="message"></div>

    </div>

    <script>

        function showRegister() {
            document.getElementById("authBox").style.display = "block";
            document.getElementById("authTitle").textContent = "Registrieren";

            document.getElementById("registerButton").style.display = "block";
            document.getElementById("loginButton").style.display = "none";

            document.getElementById("message").textContent = "";
        }

        function showLogin() {
            document.getElementById("authBox").style.display = "block";
            document.getElementById("authTitle").textContent = "Anmelden";

            document.getElementById("registerButton").style.display = "none";
            document.getElementById("loginButton").style.display = "block";

            document.getElementById("message").textContent = "";
        }

        async function register() {

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (!email || !password) {
                document.getElementById("message").textContent =
                    "Bitte E-Mail und Passwort eingeben.";
                return;
            }

            const { data, error } =
                await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

            if (error) {
                document.getElementById("message").textContent =
                    "Fehler: " + error.message;
                return;
            }

            document.getElementById("message").textContent =
                "Konto erstellt! Bitte prüfe deine E-Mail.";
        }

        async function login() {

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                document.getElementById("message").textContent =
                    "Fehler: " + error.message;
                return;
            }

            document.getElementById("message").textContent =
                "Du bist erfolgreich angemeldet! 🎉";
        }

    </script>

</body>
</html>
