<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LernWelt – Natürliche Zahlen</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 30px 20px;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
        }

        .explanation {
            background: #eff6ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: left;
        }

        .visual {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 22px;
        }

        .numberline {
            margin: 25px 10px;
            position: relative;
            height: 70px;
        }

        .line {
            position: absolute;
            top: 30px;
            left: 5%;
            right: 5%;
            height: 4px;
            background: #333;
        }

        .point {
            position: absolute;
            top: 20px;
            width: 15px;
            height: 15px;
            background: #2563eb;
            border-radius: 50%;
            transform: translateX(-50%);
        }

        .number {
            position: absolute;
            top: 40px;
            transform: translateX(-50%);
            font-size: 16px;
        }

        .place {
            display: inline-block;
            padding: 15px;
            margin: 5px;
            border-radius: 8px;
            background: #dbeafe;
            min-width: 70px;
        }

        input {
            width: 80%;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin: 15px;
            box-sizing: border-box;
        }

        button {
            padding: 13px 25px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        #solution {
            display: none;
            background: #f1f5f9;
            padding: 18px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: left;
        }

        #nextButton {
            display: none;
        }

        .back {
            background: #64748b;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 LernWelt</h1>
    <p>Mathe Klasse 5</p>
</header>

<div class="container">

    <h2>🔢 Natürliche Zahlen</h2>

    <div class="explanation">
        <h3>📖 Kurze Erklärung</h3>

        <p>
            Natürliche Zahlen sind Zahlen wie 0, 1, 2, 3, 4, 5 usw.
        </p>

        <p>
            Mit natürlichen Zahlen kann man zum Beispiel zählen.
        </p>

        <p>
            Auf einem Zahlenstrahl werden kleinere Zahlen links
            und größere Zahlen rechts dargestellt.
        </p>
    </div>

    <p id="progress"></p>

    <h3 id="question"></h3>

    <div id="visual" class="visual"></div>

    <input id="answer" type="text" placeholder="Deine Antwort">

    <br>

    <button onclick="checkAnswer()">
        Antwort prüfen
    </button>

    <div id="result"></div>

    <div id="solution">
        <h3>💡 Lösung</h3>
        <p id="solutionText"></p>
    </div>

    <button id="nextButton" onclick="nextQuestion()">
        ➡️ Nächste Aufgabe
    </button>

    <br>

    <button class="back"
        onclick="window.location.href='mathe5.html'">
        ← Zurück zu den Themen
    </button>

</div>

<script>

const questions = [

    {
        q: "Welche Zahl kommt nach 7?",
        visual: "",
        answer: "8",
        solution: "Nach 7 kommt 8."
    },

    {
        q: "Welche Zahl kommt vor 10?",
        visual: "",
        answer: "9",
        solution: "Vor 10 kommt 9."
    },

    {
        q: "Welche Zahl ist größer: 8 oder 5?",
        visual: "",
        answer: "8",
        solution: "8 ist größer als 5."
    },

    {
        q: "Welche Zahl ist kleiner: 3 oder 9?",
        visual: "",
        answer: "3",
        solution: "3 ist kleiner als 9."
    },

    {
        q: "Welche Zahl fehlt?",
        visual: `
            <div class="numberline">
                <div class="line"></div>
                <div class="point" style="left:10%"></div>
                <div class="number" style="left:10%">1</div>

                <div class="point" style="left:30%"></div>
                <div class="number" style="left:30%">2</div>

                <div class="point" style="left:50%"></div>
                <div class="number" style="left:50%">?</div>

                <div class="point" style="left:70%"></div>
                <div class="number" style="left:70%">4</div>

                <div class="point" style="left:90%"></div>
                <div class="number" style="left:90%">5</div>
            </div>
        `,
        answer: "3",
        solution: "Zwischen 2 und 4 steht die 3."
    },

    {
        q: "Welche Zahl steht auf dem Zahlenstrahl bei ?",
        visual: `
            <div class="numberline">
                <div class="line"></div>

                <div class="point" style="left:10%"></div>
                <div class="number" style="left:10%">10</div>

                <div class="point" style="left:30%"></div>
                <div class="number" style="left:30%">20</div>

                <div class="point" style="left:50%"></div>
                <div class="number" style="left:50%">?</div>

                <div class="point" style="left:70%"></div>
                <div class="number" style="left:70%">40</div>

                <div class="point" style="left:90%"></div>
                <div class="number" style="left:90%">50</div>
            </div>
        `,
        answer: "30",
        solution: "Die Zahlen steigen jeweils um 10. Deshalb ist die fehlende Zahl 30."
    },

    {
        q: "Welche Zahl ist die größte?",
        visual: "12 &nbsp;&nbsp; 25 &nbsp;&nbsp; 18 &nbsp;&nbsp; 7",
        answer: "25",
        solution: "25 ist die größte Zahl."
    },

    {
        q: "Welche Zahl ist die kleinste?",
        visual: "14 &nbsp;&nbsp; 6 &nbsp;&nbsp; 20 &nbsp;&nbsp; 11",
        answer: "6",
        solution: "6 ist die kleinste Zahl."
    },

    {
        q: "Welche Zahl kommt direkt nach 99?",
        visual: "",
        answer: "100",
        solution: "Nach 99 kommt 100."
    },

    {
        q: "Welche Zahl kommt direkt vor 100?",
        visual: "",
        answer: "99",
        solution: "Vor 100 kommt 99."
    },

    {
        q: "Wie viele Einer hat die Zahl 347?",
        visual: `
            <div class="place">
                Hunderter<br><strong>3</strong>
            </div>
            <div class="place">
                Zehner<br><strong>4</strong>
            </div>
            <div class="place">
                Einer<br><strong>7</strong>
            </div>
        `,
        answer: "7",
        solution: "Die Einerstelle von 347 ist 7."
    },

    {
        q: "Wie viele Zehner hat die Zahl 582?",
        visual: `
            <div class="place">
                Hunderter<br><strong>5</strong>
            </div>
            <div class="place">
                Zehner<br><strong>8</strong>
            </div>
            <div class="place">
                Einer<br><strong>2</strong>
            </div>
        `,
        answer: "8",
        solution: "Die Zehnerstelle von 582 ist 8."
    },

    {
        q: "Wie viele Hunderter hat die Zahl 625?",
        visual: `
            <div class="place">
                Hunderter<br><strong>6</strong>
            </div>
            <div class="place">
                Zehner<br><strong>2</strong>
            </div>

                Einer<br><strong>5</strong>

        answer: "6",
        solution: "Die Hunderterstelle von 625 ist 6."
    },

    {
        q: "Welche Zahl ist größer: 125 oder 152?",
        visual: "125 &nbsp;&nbsp; 🆚 &nbsp;&nbsp; 152",
        answer: "152",
        solution: "152 ist größer als 125."
    },

    {
        q: "Welche Zahl ist kleiner: 203 oder 230?",
        visual: "203 &nbsp;&nbsp; 🆚 &nbsp;&nbsp; 230",
        answer: "203",
        solution: "203 ist kleiner als 230."
    },

    {
        q: "Ordne von klein nach groß: 4, 1, 3, 2.",
        visual: "🔢 4 &nbsp; 1 &nbsp; 3 &nbsp; 2",
        answer: "1,2,3,4",
        solution: "Richtig geordnet: 1, 2, 3, 4."
    },

    {
        q: "Ordne von groß nach klein: 2, 8, 5, 1.",
        visual: "🔢 2 &nbsp; 8 &nbsp; 5 &nbsp; 1",
        answer: "8,5,2,1",
        solution: "Richtig geordnet: 8, 5, 2, 1."
    },

    {
        q: "Welche Zahl fehlt?",
        visual: "10 → 20 → 30 → ❓ → 50",
        answer: "40",
        solution: "Die Zahlen steigen immer um 10. Deshalb fehlt 40."
    },

    {
        q: "Welche Zahl fehlt?",
        visual: "100 → 200 → ❓ → 400 → 500",
        answer: "300",
        solution: "Die Zahlen steigen immer um 100. Deshalb fehlt 300."
    },

    {
        q: "Welche Zahl ist 10 größer als 25?",
        visual: "25 ➡️ +10 ➡️ ❓",
        answer: "35",
        solution: "25 + 10 = 35."
    },

    {
        q: "Welche Zahl ist 10 kleiner als 50?",
        visual: "50 ➡️ -10 ➡️ ❓",
        answer: "40",
        solution: "50 - 10 = 40."
    },

    {
        q: "Welche Zahl ist 100 größer als 200?",
        visual: "200 ➡️ +100 ➡️ ❓",
        answer: "300",
        solution: "200 + 100 = 300."
    },

    {
        q: "Welche Zahl ist 100 kleiner als 500?",
        visual: "500 ➡️ -100 ➡️ ❓",
        answer: "400",
        solution: "500 - 100 = 400."
    },

    {
        q: "Welche Zahl steht genau zwischen 20 und 22?",
        visual: "20 ─── ❓ ─── 22",
        answer: "21",
        solution: "21 liegt genau zwischen 20 und 22."
    },

    {
        q: "Welche Zahl steht genau zwischen 40 und 42?",
        visual: "40 ─── ❓ ─── 42",
        answer: "41",
        solution: "41 liegt genau zwischen 40 und 42."
    },

    {
        q: "Wie viele Zahlen siehst du?",
        visual: `
            🔵 1 &nbsp;
            🔵 2 &nbsp;
            🔵 3 &nbsp;
            🔵 4 &nbsp;
            🔵 5
        `,
        answer: "5",
        solution: "Du siehst 5 Zahlen."
    },

    {
        q: "Welche Zahl ist größer: 999 oder 1000?",
        visual: "999 &nbsp;&nbsp; 🆚 &nbsp;&nbsp; 1000",
        answer: "1000",
        solution: "1000 ist größer als 999."
    },

    {
        q: "Welche Zahl ist kleiner: 1000 oder 1001?",
        visual: "1000 &nbsp;&nbsp; 🆚 &nbsp;&nbsp; 1001",
        answer: "1000",
        solution: "1000 ist kleiner als 1001."
    },

    {
        q: "Wie heißt die Zahl nach 9999?",
        visual: "9999 ➡️ ❓",
        answer: "10000",
        solution: "Nach 9999 kommt 10000."
    },

    {
        q: "Wie heißt die Zahl vor 10000?",
        visual: "❓ ➡️ 10000",
        answer: "9999",
        solution: "Vor 10000 kommt 9999."
    },

    {
        q: "Welche Zahl ist am größten?",
        visual: "456 &nbsp;&nbsp; 654 &nbsp;&nbsp; 546 &nbsp;&nbsp; 465",
        answer: "654",
        solution: "654 ist die größte Zahl."
    }

];

let current = 0;

function showQuestion() {

    document.getElementById("question").textContent =
        questions[current].q;

    document.getElementById("visual").innerHTML =
        questions[current].visual;

    document.getElementById("progress").textContent =
        "Aufgabe " + (current + 1) +
        " von " + questions.length;

    document.getElementById("answer").value = "";

    document.getElementById("answer").disabled = false;

    document.getElementById("result").textContent = "";

    document.getElementById("solution").style.display = "none";

    document.getElementById("nextButton").style.display = "none";
}

function checkAnswer() {

    const userAnswer =
        document.getElementById("answer").value
        .trim()
        .toLowerCase()
        .replace(/\s/g, "");

    const correctAnswer =
        questions[current].answer
        .toLowerCase()
        .replace(/\s/g, "");

    if (userAnswer === correctAnswer) {

        document.getElementById("result").textContent =
            "✅ Richtig! Sehr gut! 🎉";

    } else {

        document.getElementById("result").textContent =
            "❌ Leider falsch.";

        document.getElementById("solution").style.display =
            "block";

        document.getElementById("solutionText").textContent =
            questions[current].solution;
    }

    document.getElementById("answer").disabled = true;

    document.getElementById("nextButton").style.display =
        "inline-block";
}

function nextQuestion() {

    current++;

    if (current >= questions.length) {

        document.getElementById("question").textContent =
            "🎉 Du hast alle 30 Aufgaben geschafft!";

        document.getElementById("progress").textContent =
            "Fertig! 🏆";

        document.getElementById("visual").style.display =
            "none";

        document.getElementById("answer").style.display =
            "none";

        document.getElementById("result").textContent =
            "Super gemacht! 🎓";

        document.getElementById("nextButton").style.display =
            "none";

        document.getElementById("solution").style.display =
            "none";

        return;
    }

    showQuestion();
}

showQuestion();

</script>

</body>
</html>
