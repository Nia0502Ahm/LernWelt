let current=0;
let language=localStorage.getItem("language")||"de";

function changeLanguage(lang){
language=lang;
localStorage.setItem("language",lang);

const t=translations[lang];

document.getElementById("subtitle").textContent=t.subtitle;
document.getElementById("languageText").textContent=t.language;
document.getElementById("title").textContent=t.title;
document.getElementById("explanationTitle").textContent=t.explanationTitle;
document.getElementById("explanationText").textContent=t.explanationText;
document.getElementById("checkButton").textContent=t.check;
document.getElementById("solutionTitle").textContent=t.solution;
document.getElementById("nextButton").textContent=t.next;
document.getElementById("backButton").textContent=t.back;
document.getElementById("answer").placeholder=t.placeholder;

showQuestion();
}

function showQuestion(){

const q=questions[current];

document.getElementById("question").textContent=q.q[language];
document.getElementById("visual").innerHTML=q.visual;

document.getElementById("progress").textContent=
(language==="de"?"Aufgabe ":
language==="en"?"Question ":"پوښتنه ")
+(current+1)+" / 30";

document.getElementById("answer").value="";
document.getElementById("answer").disabled=false;
document.getElementById("result").textContent="";
document.getElementById("solution").style.display="none";
document.getElementById("nextButton").style.display="none";
}

function checkAnswer(){

const userAnswer=document.getElementById("answer").value
.trim()
.toLowerCase();

const correct=questions[current].answer.toLowerCase();
const t=translations[language];

if(userAnswer===correct){
document.getElementById("result").textContent=t.correct;
}else{
document.getElementById("result").textContent=t.wrong;
document.getElementById("solution").style.display="block";
document.getElementById("solutionText").textContent=
questions[current].s[language];
}

document.getElementById("answer").disabled=true;
document.getElementById("nextButton").style.display="inline-block";
}

function nextQuestion(){

current++;

if(current>=questions.length){

const t=translations[language];

document.getElementById("question").textContent=t.finished;
document.getElementById("progress").textContent=t.done;
document.getElementById("visual").style.display="none";
document.getElementById("answer").style.display="none";
document.getElementById("checkButton").style.display="none";
document.getElementById("result").textContent=t.great;
document.getElementById("nextButton").style.display="none";
document.getElementById("solution").style.display="none";

return;
}

showQuestion();
}

changeLanguage(language);
